<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Lyric Parser</title>
    <style>
      :root {
        --primary-color: #007aff;
        --bg-color: #f5f5f7;
        --card-bg: #ffffff;
        --text-color: #333;
        --border-color: #e0e0e0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
      }

      .main-container {
        width: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .input-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        width: 100%;
      }

      @media (max-width: 768px) {
        .input-grid {
          grid-template-columns: 1fr;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      .input-group label {
        font-weight: 600;
        margin-bottom: 10px;
        color: #666;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      textarea {
        width: 100%;
        height: 200px;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        resize: vertical;
        font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.4;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s;
      }

      textarea:focus {
        border-color: var(--primary-color);
      }

      .action-area {
        display: flex;
        justify-content: center;
        margin: 10px 0;
      }

      button {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px 40px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 25px;
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.2s;
        box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
      }

      button:active {
        transform: translateY(1px);
      }

      .result-container {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }

      .result-container h2 {
        margin-top: 0;
        font-size: 1.2em;
        color: #666;
      }

      pre {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 20px;
        border-radius: 8px;
        overflow-x: auto;
        font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        font-size: 13px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
    </style>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <div class="main-container">
      <h1>Music Lyric Parser</h1>

      <div class="input-grid">
        <div class="input-group">
          <label for="input-original">Original Lyrics</label>
          <textarea id="input-original" placeholder="Paste original lyrics here..."></textarea>
        </div>
        <div class="input-group">
          <label for="input-syllable">Syllable Lyrics</label>
          <textarea id="input-syllable" placeholder="Paste syllable lyrics here..."></textarea>
        </div>
        <div class="input-group">
          <label for="input-translate">Translation</label>
          <textarea id="input-translate" placeholder="Paste translation here..."></textarea>
        </div>
        <div class="input-group">
          <label for="input-roman">Romanization</label>
          <textarea id="input-roman" placeholder="Paste romanization here..."></textarea>
        </div>
      </div>

      <div class="action-area">
        <button id="btn-parse">Parse Lyrics</button>
      </div>

      <div class="result-container">
        <h2>Parse Result</h2>
        <pre id="output-result">// Result will appear here...</pre>
      </div>
    </div>
  </body>
</html>
